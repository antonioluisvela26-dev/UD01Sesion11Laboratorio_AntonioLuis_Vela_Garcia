services:
  hadoop:
    image: apache/hadoop:3.4.0
    container_name: hadoop-lab
    hostname: hadoop-lab
    ports:
      - "9870:9870"   # NameNode Web UI
      - "8088:8088"   # YARN Web UI
    volumes:
      - ./datos:/workspace
      - ./scripts/init-hadoop.sh:/init-hadoop.sh
    entrypoint: ["/bin/bash", "/init-hadoop.sh"]